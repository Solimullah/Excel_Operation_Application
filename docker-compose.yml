# ---------------------------------------------------------------------------
# Two profiles:
#   docker compose up dev    → Vite dev server with hot reload on :3000
#   docker compose up app    → production nginx image on :8080
# ---------------------------------------------------------------------------

services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      # Keep container node_modules separate from the host's, so a macOS or
      # Windows host does not shadow Linux-built native binaries.
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    profiles: [dev]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: 'ExcelFile Operations'
        VITE_BASE_PATH: '/'
        VITE_LOG_LEVEL: 'error'
    image: excelfile-operations:local
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    profiles: [app]

volumes:
  node_modules:
