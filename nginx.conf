server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers --------------------------------------------------
    # Everything is served from this origin. Tailwind is compiled at build time
    # and Roboto is self-hosted at /fonts, so there are no CDN hosts in the
    # policy at all; the xlsx, jszip and PapaParse copies the tools use are
    # vendored under /extra-tools/vendor, precisely so they are not
    # third-party requests.
    #
    # 'unsafe-inline' covers the pre-paint theme script in index.html and the
    # inline scripts in each tool page. 'unsafe-eval' is required by the
    # vendored jszip.min.js, which uses `new Function` for global detection.
    #
    # frame-ancestors is 'self', NOT 'none'. 'none' blocks framing from every
    # origin including same-origin, so it would render all five Extra Tools
    # blank - and it silently overrides the X-Frame-Options below. This does
    # not reproduce under `npm run dev` or `npm run preview`, because Vite
    # sends no CSP.
    #
    # connect-src stays 'self': no spreadsheet data is ever sent anywhere.
    # If you find yourself widening THAT, re-read context/system-rules.md §1.
    #
    # Render does not read this file - it serves a static site. The same policy
    # is duplicated in render.yaml; change both together.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # --- Caching -----------------------------------------------------------
    # Vite emits content-hashed filenames, so hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded spreadsheets never reach this server, but keep the body limit
    # small anyway — nothing should be POSTing here at all.
    client_max_body_size 1m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
