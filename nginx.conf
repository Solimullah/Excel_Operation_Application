server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers --------------------------------------------------
    # This application makes no network requests of its own and loads no
    # third-party code once bundled. The CSP below reflects that: if you find
    # yourself widening connect-src, re-read context/system-rules.md §1 first.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # --- Caching -----------------------------------------------------------
    # Vite emits content-hashed filenames, so hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded spreadsheets never reach this server, but keep the body limit
    # small anyway — nothing should be POSTing here at all.
    client_max_body_size 1m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
